server:
  port: 8082   # account-service will run on 8082 inside container

spring:
  application:
    name: account-service   # must match service name in Eureka

  datasource:
    url: jdbc:postgresql://postgres:5432/BankManagementSystem
    username: postgres
    password: 456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # use validate in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "a3a9b7cbe55a42fd83cf1b7df3e9e7f178fd3a07b2d6f4cbb31f2d47ac982bd0"

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/   # Docker service name
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.cloud.openfeign: DEBUG
