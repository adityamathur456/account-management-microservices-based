server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://postgres:5432/BankManagementSystem
#    url: jdbc:postgresql://localhost:5432/BankManagementSystem
    username: postgres
    password: "YOUR_PASSWORD"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update   # use validate in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "YOUR_SECRET_KEY"
# Eureka Initialization
eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/   # fixed for Docker
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.springframework.cloud.openfeign: DEBUG
