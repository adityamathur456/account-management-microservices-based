server:
  port: 8083  # transaction-service port

spring:
  application:
    name: transaction-service

  datasource:
#    url: jdbc:postgresql://localhost:5432/BankManagementSystem
    url: jdbc:postgresql://postgres:5432/BankManagementSystem
    username: postgres
    password: "YOUR_PASSWORD"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # dev mode, use validate in prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: "YOUR_SECRET_KEY"

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
